# Arabic copy for rule cards. Wording only: the logic lives in clinical_rules.yaml.
# AR-REVIEW: every string must be reviewed by a native speaker and the clinical reviewer before the pitch.
RF1_heavy_bleeding_with_dizziness:
  message: "النزيف الغزير جداً مع الدوخة أو الإغماء يحتاج رعاية عاجلة. اتصلي بالرقم 998 أو توجهي إلى أقرب قسم طوارئ."
RF2_severe_sudden_pain_possible_pregnancy:
  message: "الألم الحوضي المفاجئ والشديد، خاصة مع الحرارة أو احتمال الحمل، يحتاج رعاية عاجلة. اتصلي بالرقم 998."
RF3_postmenopausal_or_pregnancy_bleeding:
  message: "النزيف أثناء الحمل أو بعد انقطاع الطمث يجب أن يفحصه الطبيب اليوم."
RF4_SELF_HARM_THOUGHTS:
  message: "أخبرتِنا أن أفكاراً عن إيذاء نفسك راودتك. أنتِ تستحقين الدعم الآن. اتصلي بالرقم 998 أو تحدثي مع طبيبتك اليوم. لستِ وحدك."
RF5_PREGNANCY_WARNING_SIGNS:
  message: "هذه العلامات أثناء الحمل تحتاج فحصاً اليوم. اتصلي بالرقم 998 أو توجهي إلى وحدة الولادة الآن."
RF6_POSTPARTUM_WARNING_SIGNS:
  message: "بعد الولادة، الصداع الشديد مع تغيّر الرؤية أو النزيف الغزير جداً أو الحرارة يحتاج رعاية عاجلة. اتصلي بالرقم 998."
OBS_IRREGULAR_CYCLES:
  title: "أطوال دوراتك كانت غير منتظمة"
  explains: "تصف الإرشادات الدولية لمتلازمة تكيّس المبايض لعام 2023 الدورات الأقصر من 21 يوماً أو الأطول من 35 يوماً، أو أقل من 8 دورات في السنة، بأنها غير منتظمة لدى البالغات بعد أكثر من 3 سنوات من أول دورة."
  next_steps: ["استمري في تسجيل تواريخ بدء الدورة، فالنمط يتضح أكثر مع 6 دورات أو أكثر.", "فكّري في مناقشة هذا النمط مع طبيبة نساء أو طبيب أسرة.", "للدورات غير المنتظمة أسباب كثيرة، منها التوتر وتغيّرات الغدة الدرقية وتغيّر الوزن ومتلازمة تكيّس المبايض."]
OBS_IRREGULAR_PLUS_ANDROGEN:
  title: "دورات غير منتظمة مع تغيّرات في البشرة والشعر"
  explains: "تذكر الإرشادات الدورات غير المنتظمة وعلامات ارتفاع الأندروجين (مثل حب الشباب أو نمو الشعر الزائد) كعلامتين من العلامات التي ينظر إليها الأطباء عند التفكير في متلازمة تكيّس المبايض (PCOS). الطبيب وحده يستطيع التقييم."
  next_steps: ["اسألي طبيبتك إن كان تقييم متلازمة تكيّس المبايض مناسباً لك.", "أحضري هذا التقرير، ففيه تواريخ الدورات غير المنتظمة وأيام الأعراض.", "قد يقترح الطبيب تحاليل دم أو أشعة صوتية، ولا يمكن لـ ReproSense أن يحل محلها."]
OBS_SEVERE_CYCLICAL_PAIN:
  title: "ألم الدورة كان شديداً ويؤثر على حياتك اليومية"
  explains: "ألم الدورة الشديد والمتكرر الذي يمنعك من ممارسة أنشطتك المعتادة يستحق الفحص. بطانة الرحم المهاجرة أحد الأسباب المحتملة، وغالباً ما يستغرق التعرف عليها سنوات."
  next_steps: ["فكّري في حجز موعد لدى طبيبة نساء وأحضري سجل الألم.", "سجّلي المسكنات التي جربتها وهل ساعدت."]
OBS_CYCLICAL_BOWEL_BLADDER_PAIN:
  title: "ألم أثناء التبرز أو التبول خلال الدورة"
  explains: "الألم أثناء التبرز أو التبول حول وقت الدورة عَرَض يسأل عنه الأطباء عند التفكير في بطانة الرحم المهاجرة."
  next_steps: ["اذكري هذا تحديداً لطبيبتك، فمن السهل نسيانه أثناء الموعد."]
OBS_HEAVY_OR_LONG_PERIODS:
  title: "الدورات كانت غزيرة أو طويلة"
  explains: "النزيف أكثر من 7 أيام، أو الإغراق، أو الجلطات الكبيرة، أو مجموع 100 أو أكثر على مخطط فقدان الدم المصوّر (PBAC) في الدورة، علامات على نزيف شهري غزير قد يسبب التعب ونقص الحديد."
  next_steps: ["فكّري في مناقشة النزيف الغزير مع طبيبتك؛ تحليل الدم للحديد أمر شائع."]
OBS_NO_PERIOD_90_DAYS:
  title: "لم تُسجَّل دورة منذ 90 يوماً أو أكثر"
  explains: "غياب الدورة لثلاثة أشهر أو أكثر يستحق المراجعة مع الطبيب. اختبار الحمل خطوة أولى مناسبة."
  next_steps: ["فكّري في إجراء اختبار حمل منزلي.", "فكّري في حجز موعد مع الطبيب."]
CARE_POSTPARTUM_GLUCOSE_TEST:
  title: "قد يكون موعد فحص السكر بعد الولادة قد حان"
  explains: "بعد سكري الحمل، توصي الإرشادات بفحص الجلوكوز بعد 4 إلى 12 أسبوعاً من الولادة، ثم فحوص منتظمة، لأن خطر السكري من النوع الثاني أعلى."
  next_steps: ["اطلبي من عيادتك حجز اختبار تحمّل الجلوكوز.", "إذا كنتِ تخططين لحمل آخر، اسألي عن الفحوص قبل الحمل."]
OBS_TTC_FERTILITY_ASSESSMENT:
  title: "قد يكون الوقت مناسباً للسؤال عن فحص الخصوبة"
  explains: "تقترح الإرشادات تقييم الخصوبة بعد 12 شهراً من المحاولة، أو أبكر من عمر 35 (بعد 6 أشهر). الدورات غير المنتظمة أو بطانة الرحم المهاجرة أو الالتهاب الحوضي السابق أسباب للسؤال أبكر."
  next_steps: ["فكّري في حجز تقييم للخصوبة؛ يمكن تقييم الشريكين.", "أحضري سجل دوراتك، فانتظامها معلومة مفيدة للطبيب.", "استمري في تناول حمض الفوليك (400 ميكروغرام يومياً) أثناء المحاولة."]
OBS_HEAVY_WITH_FATIGUE:
  title: "دورات غزيرة مع تعب"
  explains: "النزيف الشهري الغزير سبب شائع لنقص الحديد. توصي إرشادات NICE رقم NG88 بتعداد دم كامل للنساء ذوات النزيف الغزير. للتعب وحده أسباب كثيرة."
  next_steps: ["اسألي طبيبتك إن كان تحليل الدم للحديد مناسباً لك."]
CARE_PREGNANCY_GLUCOSE_SCREEN:
  title: "نافذة فحص سكر الحمل مفتوحة الآن"
  explains: "توصي الإرشادات بفحص سكري الحمل بين الأسبوعين 24 و28 من الحمل، عادةً باختبار تحمّل الجلوكوز."
  next_steps: ["اطلبي من فريق متابعة الحمل حجز الفحص قبل الأسبوع 28.", "يمكن لمنسقة الرعاية كتابة مسودة الطلب وأسئلتك؛ لا يُرسل شيء قبل موافقتك."]
OBS_POSTPARTUM_MOOD:
  title: "فحص المزاج يشير إلى أن الحديث مع أحد قد يفيدك"
  explains: "على مقياس إدنبرة للاكتئاب بعد الولادة، مجموع 10 أو أكثر يعني أن الحديث مع طبيبة أو قابلة سيكون مفيداً. انخفاض المزاج بعد الولادة شائع ويمكن علاجه. النتيجة ليست تشخيصاً."
  next_steps: ["فكّري في إخبار طبيبتك أو القابلة أو شخص تثقين به بما تشعرين به.", "إذا راودتك أفكار عن إيذاء نفسك، اتصلي بالرقم 998 أو تحدثي مع طبيبة اليوم."]
OBS_PERIMENOPAUSE_SYMPTOMS:
  title: "أعراض تأتي غالباً مع مرحلة ما قبل انقطاع الطمث"
  explains: "الهبّات الساخنة والتعرق الليلي وتغيّر الدورة بعد عمر 45 شائعة في مرحلة ما قبل انقطاع الطمث. تقول إرشادات NICE رقم NG23 إنه يمكن التعرف عليها عادةً من الأعراض دون تحاليل، وإن هناك علاجات فعالة."
  next_steps: ["فكّري في مناقشة أعراضك وخيارات العلاج مع طبيبة.", "أحضري تقويم الأعراض ونتائج مقياس تقييم انقطاع الطمث.", "أي نزيف بعد توقف الدورة 12 شهراً يجب فحصه."]
