# Dependency updates (docs/07, "Dependency and code scanning"). Weekly, grouped so a week's minor and patch updates
# arrive as one pull request per ecosystem; security updates are opened as soon as an advisory is published.
# The phone app (apps/mobile) is left out on purpose: Expo pins its SDK's versions, so its updates go through
# `npx expo install --fix` in a phone PR (docs/21).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
