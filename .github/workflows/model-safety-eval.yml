name: model-safety-eval
# Build week K7: scores the language model's second safety check on held-out round 5 (never tuned on it).
# Run it by hand (Actions → model-safety-eval → Run workflow) after adding the repository secret OPENROUTER_API_KEY
# (Settings → Secrets and variables → Actions). Synthetic questions only; nobody's record is sent.
# The result is written next to the word-checks number (eval_results.json → heldout_with_model) and opened as a PR,
# so /status shows it only after review. Without the secret the job stops with a clear message.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model id (must answer JSON)"
        required: true
        default: anthropic/claude-sonnet-4.5

permissions:
  contents: write
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reprosense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reprosense
      DEMO_MODE: "true"
      LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ inputs.model }}
    steps:
      - name: The key must be set
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add the repository secret OPENROUTER_API_KEY first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Random demo keys (never committed, masked in the log)
        run: |
          NK=$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')
          DT=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')
          echo "::add-mask::$NK"; echo "::add-mask::$DT"
          echo "NOTES_KEY=$NK" >> "$GITHUB_ENV"
          echo "DEMO_TOKEN_SECRET=$DT" >> "$GITHUB_ENV"
      - name: Seed (schema, synthetic data, knowledge-base index)
        working-directory: backend
        run: uv sync --python 3.12 && uv run python -m app.db.seed
      - name: Score held-out round 5 with the model's second check
        working-directory: backend
        run: uv run python -m app.ai.safety_eval | tee "$RUNNER_TEMP/score.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: model-safety-score
          path: |
            backend/app/ai/eval_results.json
            ${{ runner.temp }}/score.txt
      - name: Open a PR with the result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="eval/model-safety-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add backend/app/ai/eval_results.json
          git commit -m "Model safety check scored on held-out round 5 (${OPENROUTER_MODEL})"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "K7 Model safety check score: held-out round 5 with ${OPENROUTER_MODEL}" \
            --body "$(printf 'Scored by the model-safety-eval workflow (run %s).\n\n```\n%s\n```\n' "$GITHUB_RUN_ID" "$(cat "$RUNNER_TEMP/score.txt")")" \
            || echo "::warning::Could not open the PR (repository setting may block Actions from creating PRs). The branch $branch and the artifact hold the result."
