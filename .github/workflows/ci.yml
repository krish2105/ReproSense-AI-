name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reprosense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reprosense_test
      DEMO_MODE: "true"
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Random demo keys (never committed, masked in the log)
        run: |
          NK=$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')
          DT=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')
          echo "::add-mask::$NK"; echo "::add-mask::$DT"
          echo "NOTES_KEY=$NK" >> "$GITHUB_ENV"
          echo "DEMO_TOKEN_SECRET=$DT" >> "$GITHUB_ENV"
      - name: Lint
        working-directory: backend
        run: uv sync --python 3.12 && uv run ruff check app tests
      - name: Tests (rules, API, RLS, security, 60-question AI eval)
        working-directory: backend
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (messages parity, copy guard, API helpers, formatting)
        run: pnpm test
      - name: Build
        run: pnpm build

  # The 3-minute demo path end to end on the real stack (seeded API + production web build), at 1280 and 390 px:
  # every key screen in English and Arabic through axe (WCAG 2.2 AA), the 998 red flag, the 3D fallbacks, and zero
  # console errors. No LLM key, so answers are extractive and repeatable.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reprosense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reprosense
      DEMO_MODE: "true"
      LLM_PROVIDER: none
      # Demo-safe mode (issue #24): a dummy key and a dead model address, so "none" must win and any leak fails offline
      ANTHROPIC_API_KEY: demo-safe-ci-not-a-key
      ANTHROPIC_BASE_URL: http://127.0.0.1:9
      E2E_DEMO_SAFE: "1"
      API_URL: http://127.0.0.1:8010
      ALLOWED_ORIGINS: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Random demo keys (never committed, masked in the log)
        run: |
          NK=$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')
          DT=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')
          echo "::add-mask::$NK"; echo "::add-mask::$DT"
          echo "NOTES_KEY=$NK" >> "$GITHUB_ENV"
          echo "DEMO_TOKEN_SECRET=$DT" >> "$GITHUB_ENV"
      - name: Seed the demo database (schema, RLS, synthetic data, RAG index)
        working-directory: backend
        run: uv sync --python 3.12 && uv run python -m app.db.seed
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Production build
        working-directory: apps/web
        run: pnpm build
      - name: Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Demo path, screens, safety and 3D fallbacks
        working-directory: apps/web
        run: pnpm e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  generator-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic data generator validates all personas and is byte-identical
        run: |
          python3 data/synthetic/generate_synthetic.py
          git diff --exit-code data/synthetic/output

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The gitleaks action scans "first-commit^..HEAD", which fails on a repo's first push; the CLI scans all history.
      - name: Scan full git history for secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact -v --exit-code 1 .
      - name: No AI co-author lines in commit messages
        run: |
          if git log --format=%B | grep -qiE '^co-authored-by:.*(claude|anthropic|openai|chatgpt|copilot|gemini)|generated with \[?claude'; then
            echo "::error::A commit message has an AI co-author or 'Generated with' line (CLAUDE.md, Git)"; exit 1
          fi

  # The deploy image (docs/16_DEPLOY_NOW.md): it must keep building, with Pango and the fonts for the doctor PDF.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image from the repository root
        run: docker build -f backend/Dockerfile -t reprosense-api:ci .
