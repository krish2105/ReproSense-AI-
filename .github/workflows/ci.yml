name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reprosense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reprosense_test
      DEMO_MODE: "true"
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Random demo keys (never committed)
        run: |
          echo "NOTES_KEY=$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
          echo "DEMO_TOKEN_SECRET=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Lint
        working-directory: backend
        run: uv sync --python 3.12 && uv run ruff check app tests
      - name: Tests (rules, API, RLS, security, 60-question AI eval)
        working-directory: backend
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (messages parity, copy guard, API helpers, formatting)
        run: pnpm test
      - name: Build
        run: pnpm build

  generator-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic data generator validates all personas and is byte-identical
        run: |
          python3 data/synthetic/generate_synthetic.py
          git diff --exit-code data/synthetic/output

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The gitleaks action scans "first-commit^..HEAD", which fails on a repo's first push; the CLI scans all history.
      - name: Scan full git history for secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact -v --exit-code 1 .
