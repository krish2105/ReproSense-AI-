# Render blueprint for the ReproSense API and its database (docs/16_DEPLOY_NOW.md). The web app goes on Vercel.
# Database: a free Render Postgres in the same region, chosen by Krishna on 18 Nov because the Supabase account had
# reached its two free projects. Render passes the connection string to the API itself, so no secret is copied by
# hand. Free Render databases expire 30 days after creation (well after the 22 Nov showcase). Synthetic data only.
databases:
  - name: reprosense-db
    databaseName: reprosense
    user: reprosense
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: [] # only Render services in this workspace can connect (internal network)
services:
  - type: web
    name: reprosense-api
    runtime: docker
    # Same region as the Supabase database (eu-central-1) and the Vercel functions (fra1, apps/web/vercel.json):
    # every page makes several API-to-database round trips, so the three must sit together (docs/16).
    region: frankfurt
    # Free until demo day. Without a plan Render creates a paid 0.5c-512mb instance. For the showcase, switch the
    # instance type to a paid one in the dashboard for the day (free instances sleep after ~15 minutes idle).
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL # the Render database above, over Render's internal network
        fromDatabase:
          name: reprosense-db
          property: connectionString
      - key: ALLOWED_ORIGINS # the live web app on Vercel
        value: https://reprosense.vercel.app
      - key: DEMO_TOKEN_SECRET
        generateValue: true
      - key: NOTES_KEY # 32 random bytes, base64 (Render generates a 256-bit base64 value; the API checks it at boot)
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_IF_EMPTY # loads the synthetic demo data on the first boot only
        value: "true"
      - key: LLM_PROVIDER # "auto": Claude if ANTHROPIC_API_KEY is set, else OpenRouter if OPENROUTER_API_KEY is set, else none
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY # the hackathon credits (programs.upstartbar.com); Krishna sets it in the dashboard
        sync: false
      - key: OPENROUTER_MODEL # one of the models the credits allow
        value: anthropic/claude-sonnet-4.5
